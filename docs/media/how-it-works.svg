<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B7375"/></marker>
    <style>
      .box{rx:12;ry:12}
      .t{font-size:15px;font-weight:700;fill:#16313A}
      .s{font-size:12px;fill:#4A5759}
      .tag{font-size:11px;font-weight:700}
      .ln{stroke:#5B7375;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="470" fill="#F4FBF9"/>

  <!-- 1. 화면 -->
  <rect class="box" x="24" y="24" width="260" height="92" fill="#fff" stroke="#B9E2D9" stroke-width="1.5"/>
  <text class="t" x="40" y="52">① 화면 · 진료실</text>
  <text class="s" x="40" y="74">Vue 3 + Three.js · GitHub Pages</text>
  <text class="s" x="40" y="94">파일 올리기 · 말로 조건 주기</text>

  <!-- 2. API -->
  <rect class="box" x="350" y="24" width="260" height="92" fill="#fff" stroke="#B9E2D9" stroke-width="1.5"/>
  <text class="t" x="366" y="52">② API 서버</text>
  <text class="s" x="366" y="74">FastAPI · 운영자 Mac (Tailscale)</text>
  <text class="s" x="366" y="94">진행 단계를 실시간으로 흘려 보냄</text>

  <!-- 저장 -->
  <rect class="box" x="676" y="24" width="260" height="92" fill="#fff" stroke="#B9E2D9" stroke-width="1.5"/>
  <text class="t" x="692" y="52">⑤ 기록 · SQLite</text>
  <text class="s" x="692" y="74">대화 맥락 · 계획 · 캘린더</text>
  <text class="s" x="692" y="94">실행 로그 (로깅 Agent가 따로 저장)</text>

  <path class="ln" d="M284 62H346"/>
  <path class="ln" d="M346 84H288"/>
  <text class="s" x="292" y="56" font-size="10">요청</text>
  <text class="s" x="292" y="100" font-size="10">단계·답</text>
  <path class="ln dash" d="M610 70H672"/>
  <path class="ln" d="M480 116V172"/>

  <!-- 3. Agent 단계 -->
  <text class="t" x="24" y="160">③ 메인 Agent — 한 번의 대화가 지나가는 길 (LangGraph)</text>
  <g>
    <rect class="box" x="24"  y="176" width="138" height="78" fill="#FFF1EC" stroke="#F2734A" stroke-width="1.5"/>
    <text class="t" x="38" y="202">무엇을 원하나</text><text class="s" x="38" y="222">의도·조건 읽기</text>
    <text class="tag" x="38" y="242" fill="#C2502C">LLM</text>

    <rect class="box" x="178" y="176" width="138" height="78" fill="#FFF1EC" stroke="#F2734A" stroke-width="1.5"/>
    <text class="t" x="192" y="202">무엇을 조회할까</text><text class="s" x="192" y="222">Tool 종류·순서만</text>
    <text class="tag" x="192" y="242" fill="#C2502C">LLM</text>

    <rect class="box" x="332" y="176" width="138" height="78" fill="#E3F4F0" stroke="#3E9E98" stroke-width="1.5"/>
    <text class="t" x="346" y="202">조회</text><text class="s" x="346" y="222">패키지마다 반복</text>
    <text class="tag" x="346" y="242" fill="#1F6F6B">코드 → Tool</text>

    <rect class="box" x="486" y="176" width="138" height="78" fill="#E3F4F0" stroke="#3E9E98" stroke-width="1.5"/>
    <text class="t" x="500" y="202">판정</text><text class="s" x="500" y="222">목표 버전·호환 검사</text>
    <text class="tag" x="500" y="242" fill="#1F6F6B">코드</text>

    <rect class="box" x="640" y="176" width="138" height="78" fill="#E3F4F0" stroke="#3E9E98" stroke-width="1.5"/>
    <text class="t" x="654" y="202">처방</text><text class="s" x="654" y="222">정렬·회차·날짜</text>
    <text class="tag" x="654" y="242" fill="#1F6F6B">코드</text>

    <rect class="box" x="794" y="176" width="142" height="78" fill="#FFF1EC" stroke="#F2734A" stroke-width="1.5"/>
    <text class="t" x="808" y="202">설명</text><text class="s" x="808" y="222">박사님 말투로 답</text>
    <text class="tag" x="808" y="242" fill="#C2502C">LLM</text>
  </g>
  <path class="ln" d="M162 215H174"/><path class="ln" d="M316 215H328"/><path class="ln" d="M470 215H482"/>
  <path class="ln" d="M624 215H636"/><path class="ln" d="M778 215H790"/>

  <!-- 재계획 루프 -->
  <path class="ln" d="M555 254C555 300 640 300 640 300H700C730 300 730 254 730 258" stroke="#F2734A"/>
  <rect class="box" x="560" y="284" width="150" height="34" fill="#fff" stroke="#F2734A" stroke-width="1.2"/>
  <text class="s" x="572" y="306">막히면 재계획 (최대 3번)</text>

  <!-- 4. 외부 API -->
  <path class="ln" d="M401 254V346"/>
  <text class="t" x="24" y="340">④ 실제 데이터 — 확인한 값만 쓴다 (없으면 "미상")</text>
  <rect class="box" x="24"  y="356" width="290" height="58" fill="#fff" stroke="#B9E2D9" stroke-width="1.5"/>
  <text class="t" x="40" y="380">endoflife.date</text><text class="s" x="40" y="400">OS·Python 지원 종료일</text>
  <rect class="box" x="330" y="356" width="290" height="58" fill="#fff" stroke="#B9E2D9" stroke-width="1.5"/>
  <text class="t" x="346" y="380">OSV.dev</text><text class="s" x="346" y="400">패키지 취약점·심각도</text>
  <rect class="box" x="636" y="356" width="300" height="58" fill="#fff" stroke="#B9E2D9" stroke-width="1.5"/>
  <text class="t" x="652" y="380">PyPI</text><text class="s" x="652" y="400">버전 목록·지원 Python</text>

  <!-- 범례 -->
  <rect x="24" y="434" width="14" height="14" rx="3" fill="#FFF1EC" stroke="#F2734A"/>
  <text class="s" x="44" y="446">LLM이 판단 (말을 이해하고 고르는 일)</text>
  <rect x="300" y="434" width="14" height="14" rx="3" fill="#E3F4F0" stroke="#3E9E98"/>
  <text class="s" x="320" y="446">코드가 계산 (버전 비교·정렬·회차·날짜 — LLM에 맡기지 않음)</text>
</svg>
