# 테스트 → 화면 빌드 → GitHub Pages 배포 (spec v1.25)
#
# 화면(Vue + Three.js)만 Pages로 나가고, API는 이 Mac의 서버를 Tailscale Funnel로 연다 (docs/deploy.md).
# API 주소는 저장소 변수 API_BASE_URL(Settings → Secrets and variables → Actions → Variables)에서 읽는다.
#   예) https://macmini.<tailnet>.ts.net   — 공개되는 주소일 뿐 비밀이 아니다. 키(GMS_KEY)는 여기 넣지 않는다.
# 비어 있으면 화면은 뜨지만 대화·업로드가 안 된다 (같은 주소의 API를 찾음).

name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # GitHub 화면에서 수동으로도

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-build:
    name: 테스트와 화면 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: 백엔드 의존성
        run: pip install -r requirements.txt

      # 네트워크 없이 저장된 응답(tests/fixtures)으로만 돈다. API 키 필요 없음
      - name: 백엔드 테스트
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 화면 의존성
        working-directory: frontend
        run: npm ci

      - name: 화면 빌드 (Pages 경로 /drpatch/)
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /drpatch/
          VITE_API_BASE: ${{ vars.API_BASE_URL }}

      - name: 빌드 결과물 올리기
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: GitHub Pages 배포
    needs: test-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
