<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DR.PATCH 진료 책상</title>
<!--
  DR.PATCH 진료 책상 시제품 (docs/design.md 기준). 한 장면, 예시 데이터 — 실제 API를 부르지 않는다.
  보는 법: python3 -m http.server 8010 --directory prototype  →  http://localhost:8010/drpatch-desk/
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #6A4DFF; --color-desk: #CBB8FF; --color-paper: #FFFDF5; --color-ink: #231942;
    --color-ok: #19E3A1; --color-replan: #FF4FD8; --color-hot: #FF4FA3;
    --sans: "IBM Plex Sans KR", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--sans); color: var(--color-ink);
         background: radial-gradient(120% 90% at 50% 40%, #8C74FF 0%, #6A4DFF 55%, #4F33E0 100%); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .brand { position: fixed; top: 20px; left: 24px; display: flex; align-items: center; gap: 12px; color: #fff; z-index: 3; }
  .brand b { font: 700 22px/1 var(--mono); letter-spacing: .02em; }
  .brand small { display: block; font: 500 12px/1.4 var(--sans); opacity: .85; margin-top: 4px; }

  .status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3;
            display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px;
            background: #fff; box-shadow: 0 4px 0 #CBB8FF, 0 10px 24px rgba(35,25,66,.25); font: 600 14px/1 var(--sans); }
  .status .dots { display: flex; gap: 6px; }
  .status .dots i { width: 9px; height: 9px; border-radius: 50%; background: #E4DCFF; transition: background .3s; }
  .status .dots i.on { background: var(--color-ok); }

  .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 3;
              display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 32px); }
  .btn { font: 600 15px/1 var(--sans); padding: 14px 22px; border-radius: 999px; border: 0; cursor: pointer;
         background: #fff; color: var(--color-ink); box-shadow: 0 5px 0 #B9A6FF, 0 12px 24px rgba(35,25,66,.25);
         transition: transform .12s, box-shadow .12s; }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #B9A6FF, 0 6px 12px rgba(35,25,66,.2); }
  .btn.primary { background: var(--color-ok); box-shadow: 0 5px 0 #0FA877, 0 12px 24px rgba(35,25,66,.25); }
  .btn.hot { background: var(--color-hot); box-shadow: 0 5px 0 #C72A78, 0 12px 24px rgba(35,25,66,.25); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .motion { display: flex; align-items: center; gap: 6px; color: #fff; font: 500 13px var(--sans); }

  .ticker { position: fixed; left: 24px; bottom: 24px; z-index: 2; font: 400 12px/1.7 var(--mono); color: #fff;
            opacity: .9; max-width: 340px; }
  .ticker div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticker div:first-child { font-weight: 700; }
  .note { position: fixed; right: 24px; bottom: 28px; z-index: 2; color: #fff; font: 500 12px var(--sans); opacity: .8; }

  .bubble { position: fixed; z-index: 4; max-width: 290px; padding: 14px 16px; border-radius: 22px 22px 6px 22px;
            background: #fff; font: 500 15px/1.55 var(--sans); box-shadow: 0 6px 0 #E3D8FF, 0 16px 30px rgba(35,25,66,.3);
            transform: translateY(-100%); width: max-content; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .bubble.show { opacity: 1; }
  .bubble b { display: block; font: 700 11px/1 var(--mono); letter-spacing: .06em; color: #7B61FF; margin-bottom: 6px; }

  .tip { position: fixed; z-index: 6; pointer-events: none; padding: 6px 10px; border-radius: 10px; background: var(--color-ink);
         color: #fff; font: 500 12px var(--mono); transform: translate(14px, 14px); opacity: 0; transition: opacity .12s; }
  .tip.show { opacity: 1; }

  /* 누르면 펼쳐지는 종이 */
  .sheet { position: fixed; top: 84px; right: 24px; width: min(380px, calc(100vw - 32px)); perspective: 1400px; z-index: 5; pointer-events: none; }
  .paper { position: relative; overflow: hidden; background: var(--color-paper); border-radius: 22px; padding: 24px 22px 20px;
           box-shadow: 0 6px 0 #E9DFFF, 0 22px 44px rgba(35,25,66,.35);
           transform-origin: 100% 50%; transform: rotateY(-100deg); opacity: 0;
           transition: transform .6s cubic-bezier(.2,1.35,.35,1), opacity .2s; }
  .sheet.open .paper { transform: none; opacity: 1; pointer-events: auto; }
  .paper::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(35,25,66,.12); pointer-events: none; }
  .paper .band { position: absolute; left: 0; right: 0; top: 0; height: 8px; }
  .paper .close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
                  background: #F1ECFF; color: var(--color-ink); font: 600 18px/1 var(--sans); }
  .eyebrow { margin: 0 0 6px; font: 700 11px/1 var(--mono); letter-spacing: .08em; color: #7B61FF; }
  .paper h2 { margin: 0 0 12px; font: 700 24px/1.2 var(--sans); }
  .ver { display: flex; align-items: baseline; gap: 10px; font: 700 24px/1.2 var(--mono); margin-bottom: 14px; flex-wrap: wrap; }
  .ver .arrow { color: #8E89A6; font-weight: 400; }
  .ver .tgt { color: #0B7A57; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge { font: 700 12px/1 var(--mono); padding: 6px 10px; border-radius: 999px; letter-spacing: .04em; }
  .sev-critical { background: #FFD3DE; color: #8F0D33; } .sev-high { background: #FFE3CC; color: #8A3A00; }
  .sev-moderate { background: #FFF3B0; color: #6B5300; } .sev-low { background: #D5EBFF; color: #0B4F8F; }
  .sev-unknown { background: #F0EEF6; color: #4A4560; outline: 1.5px dashed #8E89A6; outline-offset: -1.5px; }
  .chip { font: 600 12px/1 var(--sans); padding: 6px 10px; border-radius: 999px; border: 1.5px solid var(--color-replan); color: #8E1C7A; }
  dl { display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; margin: 0 0 14px; font-size: 14px; line-height: 1.5; }
  dt { color: #6B6585; } dd { margin: 0; }
  .docnote { margin: 0; padding: 12px 14px; border-radius: 14px; background: #F1ECFF; font-size: 14px; line-height: 1.55; }
  .docnote b { font: 700 11px/1 var(--mono); color: #7B61FF; display: block; margin-bottom: 4px; letter-spacing: .06em; }
  .list { list-style: none; margin: 0 0 14px; padding: 0; }
  .list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid #EEE8FF; }
  .list li:last-child { border-bottom: 0; }
  .list .n { font: 600 15px var(--sans); } .list .v { grid-column: 1; font: 400 13px var(--mono); color: #4A4560; }
  .list .badge { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .log { margin: 0; padding: 0; list-style: none; font: 400 12.5px/1.8 var(--mono); max-height: 52vh; overflow: auto; }

  .fallback { position: fixed; inset: 0; overflow: auto; padding: 32px 16px; background: #F5F1FF; z-index: 10; }
  .fallback > div { max-width: 640px; margin: 0 auto; }

  @media (max-width: 720px) {
    .brand { top: 14px; left: 16px; } .brand small { display: none; }
    .status { top: 64px; }
    .ticker, .note { display: none; }
    .controls { bottom: 16px; }
    .sheet { top: auto; bottom: 120px; left: 16px; right: 16px; width: auto; }
    .paper { transform-origin: 50% 100%; transform: rotateX(95deg); }
    .bubble { max-width: 220px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .paper, .bubble, .btn { transition: none; } }
  body.reduced .paper, body.reduced .bubble { transition: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<header class="brand">
  <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
    <g transform="rotate(-35 19 19)">
      <rect x="4" y="12" width="30" height="14" rx="7" fill="#19E3A1"/>
      <path d="M11 12h8v14h-8a7 7 0 0 1 0-14z" fill="#FF2E63"/>
      <rect x="8" y="14.5" width="9" height="2.5" rx="1.25" fill="#fff" opacity=".7"/>
    </g>
  </svg>
  <div><b>DR.PATCH</b><small>진료 책상 · 시제품</small></div>
</header>

<div class="status" role="status"><span id="status-text">대기 중</span>
  <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>

<div class="ticker" id="ticker" aria-hidden="true"></div>
<div class="note">예시 데이터 · 실제 조회 아님</div>

<div class="bubble" id="bubble" aria-hidden="true"><b>DR.PATCH</b><span id="bubble-text"></span></div>
<div class="sr-only" aria-live="polite" id="live"></div>
<div class="tip" id="tip"></div>

<div class="sheet" id="sheet"><div class="paper" role="dialog" aria-labelledby="sheet-title">
  <div class="band" id="sheet-band"></div>
  <button class="close" id="sheet-close" aria-label="닫기">×</button>
  <div id="sheet-body"></div>
</div></div>

<nav class="controls">
  <button class="btn primary" id="btn-start">진료 시작</button>
  <button class="btn hot" id="btn-confirm" disabled>처방 확정</button>
  <button class="btn" id="btn-reset">처음부터</button>
  <label class="motion"><input type="checkbox" id="motion"> 움직임 줄이기</label>
</nav>

<section class="fallback" id="fallback" hidden><div>
  <h1>DR.PATCH</h1>
  <p>이 브라우저에서는 3D 책상을 그릴 수 없어 목록으로 보여드려요.</p>
  <ul class="list" id="fallback-list"></ul>
</div></section>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ── 예시 데이터 (실제 조회 아님) ─────────────────────────
const SEV = { critical: ['#FF2E63', 'CRITICAL'], high: ['#FF8A1F', 'HIGH'], moderate: ['#FFD60A', 'MODERATE'],
              low: ['#2F9BFF', 'LOW'], unknown: ['#A7A3B8', '미상'] };
const ROUNDS = [{ no: 1, date: '11/21', full: '2026-11-21', win: '22:00–24:00' },
                { no: 2, date: '12/05', full: '2026-12-05', win: '22:00–24:00' }];
const ITEMS = [
  { name: 'Python', kind: 'runtime', cur: '3.8', tgt: '3.11', sev: 'high', round: 1, reason: '지원 종료일이 지났어요.', flags: ['큰 변경'], note: '오늘의 주인공이죠. 이걸 먼저 올려야 나머지가 따라옵니다.' },
  { name: 'urllib3', cur: '1.24.1', tgt: '2.2.x', sev: 'critical', round: 1, reason: '알려진 취약점이 있어요.', flags: ['큰 변경'], note: '1.24.1이라니… 꽤 오래 방치하셨군요.' },
  { name: 'requests', cur: '2.19.0', tgt: '2.32.x', sev: 'critical', round: 1, reason: '알려진 취약점이 있어요.', flags: [], note: '자주 쓰는 녀석일수록 먼저 챙겨야 합니다.' },
  { name: 'PyYAML', cur: '5.1', tgt: '6.0.x', sev: 'critical', round: 1, reason: '알려진 취약점이 있어요.', flags: ['큰 변경'], note: 'YAML은 늘 조심해서 다뤄야죠.' },
  { name: 'Django', cur: '2.2.0', tgt: '4.2.x', sev: 'high', round: 2, reason: 'Python 업그레이드 뒤에 올릴 수 있어요.', flags: ['큰 변경', '처방 변경'], note: '처음엔 5.2를 드리려 했는데 Python 3.8로는 못 넘어가더군요. 그래서 2회차입니다.' },
  { name: 'Jinja2', cur: '2.10', tgt: '3.1.x', sev: 'moderate', round: 2, reason: '알려진 취약점이 있어요.', flags: ['큰 변경'], note: '급하진 않지만 미루면 서운해합니다.' },
  { name: 'Flask', cur: '1.0.2', tgt: '3.0.x', sev: 'low', round: 2, reason: '알려진 취약점이 있어요.', flags: ['큰 변경'], note: '가벼운 증상입니다. 그래도 처방은 처방이죠.' },
  { name: 'numpy', cur: '1.16.0', tgt: '1.24.x', sev: 'unknown', round: 2, reason: '취약점은 있지만 심각도 정보가 없어요.', flags: [], note: '등급을 못 찾았어요. 모르는 건 모른다고 적습니다.' },
];
const TOOL = (it) => (it.kind === 'runtime' ? 'get_eol' : 'get_vulns');
const QUIPS = ['저요? 아주 건강합니다. 버전 관리를 잘하거든요.', '알약은 눌러야 나옵니다. 세상 이치죠.',
               '미상은 미상입니다. 지어내진 않아요.', '진료 중엔 조용히… 아, 저만 떠들고 있군요.'];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const roundOf = (no) => ROUNDS.find((r) => r.no === no);

// ── 움직임 줄이기 ───────────────────────────────────────
let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('motion').checked = reduced;
document.body.classList.toggle('reduced', reduced);
$('motion').addEventListener('change', (e) => { reduced = e.target.checked; document.body.classList.toggle('reduced', reduced); });

function hasWebGL() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; }
}

function badge(sev) { return `<span class="badge sev-${sev}">${SEV[sev][1]}</span>`; }

function showFallback() {
  $('fallback').hidden = false;
  $('fallback-list').innerHTML = ITEMS.map((it) =>
    `<li><span class="n">${esc(it.name)} · ${it.round}회차</span><span class="v">${esc(it.cur)} → ${esc(it.tgt)}</span>${badge(it.sev)}</li>`).join('');
}

if (!hasWebGL()) showFallback(); else init();

async function init() {
  try { await Promise.race([Promise.all([document.fonts.load('700 40px "IBM Plex Sans KR"'), document.fonts.load('700 40px "JetBrains Mono"')]),
                            new Promise((r) => setTimeout(r, 1500))]); } catch { /* 글꼴 없이도 진행 */ }

  // ── 렌더러·장면 ─────────────────────────────────────
  const canvas = $('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 0.95;

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.55;

  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
  const BASE = new THREE.Vector3(0, 17.5, 11.2);
  const TARGET = new THREE.Vector3(-0.2, 0.9, 0.2);
  let base = BASE.clone();

  scene.add(new THREE.HemisphereLight(0xffffff, 0xb7a1ff, 0.45));
  const sun = new THREE.DirectionalLight(0xffffff, 2.3);
  sun.position.set(-6, 14, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  scene.add(sun);

  // ── 재질·도형 도우미 ────────────────────────────────
  const soft = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.42, clearcoat: 0.7, clearcoatRoughness: 0.28,
    sheen: 0.5, sheenRoughness: 0.6, sheenColor: new THREE.Color('#ffffff'), ...o });
  const glass = (tint = '#ffffff', o = {}) => new THREE.MeshPhysicalMaterial({ color: tint, transmission: 1, roughness: 0.06,
    thickness: 0.4, ior: 1.35, transparent: true, clearcoat: 1, ...o });
  const metal = (color = '#E8EEF8', o = {}) => new THREE.MeshPhysicalMaterial({ color, metalness: 1, roughness: 0.18, ...o });
  const shadowed = (m, cast = true, receive = true) => { m.castShadow = cast; m.receiveShadow = receive; return m; };
  const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };

  function halfGeo(r, L) { // 캡슐 반쪽: 아래 반구 + 원통 (y: -L/2-r → 0)
    const pts = [];
    for (let i = 0; i <= 12; i++) { const a = -Math.PI / 2 + (Math.PI / 2) * (i / 12); pts.push(new THREE.Vector2(Math.max(0.0001, r * Math.cos(a)), -L / 2 + r * Math.sin(a))); }
    pts.push(new THREE.Vector2(r, 0), new THREE.Vector2(0.0001, 0));
    return new THREE.LatheGeometry(pts, 32);
  }

  function textTexture(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const redraw = (...a) => { g.clearRect(0, 0, w, h); draw(g, w, h, ...a); tex.needsUpdate = true; };
    redraw();
    return { tex, redraw };
  }
  const FONT = (wt, px, mono) => `${wt} ${px}px ${mono ? '"JetBrains Mono", monospace' : '"IBM Plex Sans KR", sans-serif'}`;

  // ── 움직임 엔진 ─────────────────────────────────────
  const tweens = new Set();
  const ease = { inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), out: (t) => 1 - Math.pow(1 - t, 3),
                 back: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }, lin: (t) => t };
  function tween(dur, update, e = ease.inOut) {
    return new Promise((res) => { if (reduced) { update(1); res(); return; } tweens.add({ t0: performance.now(), dur, update, e, res }); });
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 250) : ms));

  // ── 책상 ────────────────────────────────────────────
  const world = new THREE.Group(); scene.add(world);
  const desk = shadowed(new THREE.Mesh(new RoundedBoxGeometry(18, 0.8, 11.5, 6, 0.38), soft('#B7A1FF', { roughness: 0.6, clearcoat: 0.25 })), false);
  desk.position.y = -0.4; world.add(desk);
  const blotter = shadowed(new THREE.Mesh(new RoundedBoxGeometry(7.4, 0.08, 7.8, 4, 0.04), soft('#FFD9EE', { roughness: 0.8, clearcoat: 0.1 })), false);
  blotter.position.set(-0.6, 0.04, 0); world.add(blotter);

  const pickRoots = [];
  const addPick = (obj, kind, data = {}) => { obj.userData = { ...obj.userData, kind, ...data }; pickRoots.push(obj); };

  // ── 블리스터 팩 (한 판 = 한 회차) ───────────────────
  const SLOT_X = [-0.75, 0.65, 2.05], SLOT_Z = [-0.62, 0.62];
  const domeGeo = new THREE.CapsuleGeometry(0.4, 0.5, 8, 20); domeGeo.rotateZ(Math.PI / 2);
  const blisters = ROUNDS.map((r, idx) => {
    const g = new THREE.Group(); g.position.set(-0.6, 0, idx === 0 ? -1.75 : 1.75); world.add(g);
    const foilMat = new THREE.MeshPhysicalMaterial({ color: '#ECE8F7', metalness: 0.6, roughness: 0.3, clearcoat: 0.6, emissive: '#7B61FF', emissiveIntensity: 0 });
    const baseM = shadowed(new THREE.Mesh(new RoundedBoxGeometry(5.4, 0.14, 2.9, 4, 0.07), foilMat)); baseM.position.y = 0.07; g.add(baseM);
    const label = textTexture(220, 520, (c, w, h, stamped) => {
      c.fillStyle = '#231942'; c.beginPath(); c.roundRect(0, 0, w, h, 34); c.fill();

    }
    const from = stamp.position.clone();
    await tween(700, (p) => { stamp.position.lerpVectors(from, STAMP_HOME, p); stamp.position.y += Math.sin(p * Math.PI) * 0.8 * (1 - p); });
    stamp.position.y = 0;
    say('확정. 11/21 밤 10시에 뵙죠. 늦으시면 서운합니다.'); docAct.hop();
    setStatus('처방 확정', 3); state = 'done'; setButtons();
  }

  $('btn-start').addEventListener('click', runVisit);
  $('btn-confirm').addEventListener('click', confirmPlan);
  $('btn-reset').addEventListener('click', () => location.reload());

  // ── 가리키기·누르기 ─────────────────────────────────
  const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2(); let hovered = null;
  let mx = 0, my = 0, cmx = 0, cmy = 0;
  const findRoot = (o) => { while (o && !o.userData.kind) o = o.parent; return o; };
  function pick(e) {
    ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(pickRoots, true)[0];
    return hit ? findRoot(hit.object) : null;
  }
  function tipText(o) {
    const d = o.userData;
    if (d.kind === 'capsule') return state === 'idle' ? '검사 전 캡슐' : `${d.cap.it.name} ${d.cap.it.cur}`;
    if (d.kind === 'blister') return `${d.round}회차 · ${roundOf(d.round).date}`;
    return { chart: '진료 기록', doctor: '닥터 패치', jar: '접수된 패키지', stamp: '확정 도장' }[d.kind];
  }
  canvas.addEventListener('pointermove', (e) => {
    mx = (e.clientX / innerWidth) * 2 - 1; my = (e.clientY / innerHeight) * 2 - 1;
    const o = pick(e); hovered = o;
    canvas.style.cursor = o ? 'pointer' : 'default';
    const tip = $('tip');
    if (o) { tip.textContent = tipText(o); tip.style.left = `${e.clientX}px`; tip.style.top = `${e.clientY}px`; tip.classList.add('show'); }
    else tip.classList.remove('show');
  });
  canvas.addEventListener('pointerleave', () => { hovered = null; $('tip').classList.remove('show'); });
  canvas.addEventListener('click', async (e) => {
    const o = pick(e); if (!o) { closeSheet(); return; }
    const d = o.userData;
    if (d.kind === 'capsule') {
      const c = d.cap;
      if (state === 'idle' || state === 'running') { say(state === 'idle' ? '아직 검사 전이에요. 진료 시작부터 누르시죠.' : '검사 중엔 잠깐만요. 금방 끝납니다.'); return; }
      if (popped && popped !== c) await closeSheet();
      popped = c;
      if (c.slot) tween(260, (p) => (c.slot.dome.scale.y = 1 - Math.sin(p * Math.PI) * 0.35), ease.lin);
      tween(480, (p) => { c.inner.position.y = 1.1 * p; c.inner.rotation.x = p * Math.PI * 2; }, ease.back).then(() => (c.inner.rotation.x = 0));
      openSheet(itemSheet(c.it), SEV[c.it.sev][0]);
    } else if (d.kind === 'blister') {
      if (state === 'idle' || state === 'running') { say('빈 포장지예요. 처방이 나오면 채워집니다.'); return; }
      openSheet(roundSheet(d.round), '#231942');
    } else if (d.kind === 'chart') openSheet(logSheet(), '#FF9ACB');
    else if (d.kind === 'doctor') { docAct.hop(); say(QUIPS[Math.floor(Math.random() * QUIPS.length)]); }
    else if (d.kind === 'jar') say(state === 'idle' ? '접수된 패키지 8정입니다. 진료 시작을 누르시죠.' : '약병은 이제 비었습니다. 블리스터를 보세요.');
    else if (d.kind === 'stamp') { if (state === 'planned') confirmPlan(); else say('도장은 처방이 나온 뒤에 찍습니다.'); }
  });

  // ── 화면 크기 ───────────────────────────────────────
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    base = BASE.clone().multiplyScalar(Math.min(2.0, Math.max(1, 1.5 / camera.aspect))); // 세로 화면은 양옆이 잘리는 대신 크게
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  // ── 매 프레임 ───────────────────────────────────────
  const headPos = new THREE.Vector3(); let blinkAt = 2, blinkUntil = 0;
  say('어서 오세요. 오늘은 어디가 불편한 서버인가요?');
  function frame(now) {
    const t = now / 1000;
    for (const tw of tweens) { const p = Math.min(1, (now - tw.t0) / tw.dur); tw.update(tw.e(p)); if (p >= 1) { tweens.delete(tw); tw.res(); } }

    cmx += ((reduced ? 0 : mx) - cmx) * 0.05; cmy += ((reduced ? 0 : my) - cmy) * 0.05;
    camera.position.set(base.x + cmx * 1.2, base.y - cmy * 0.4, base.z + cmy * 0.8); camera.lookAt(TARGET);

    if (!reduced) {
      const breathe = Math.sin(t * 2.2);
      docBody.scale.set(1 + breathe * 0.012, 1 + breathe * 0.022, 1 + breathe * 0.012);
      doctor.rotation.y += ((-0.3 + cmx * 0.35) - doctor.rotation.y) * 0.05;
      if (t > blinkAt) { blinkUntil = t + 0.12; blinkAt = t + 2.5 + Math.random() * 3; }
      liquid.scale.x = 1 + Math.sin(t * 3) * 0.01;
      for (const c of capsules) if (c.inJar && state === 'idle') c.inner.rotation.z = Math.sin(t * 1.6 + c.phase) * 0.08;
    }
    eyes.forEach((e) => (e.scale.y = t < blinkUntil ? 0.15 : 1));

    for (const c of capsules) { const want = hovered === c.root && !c.inJar ? 0.18 : 0; c.liftY += (want - c.liftY) * 0.18; c.lift.position.y = c.liftY; }
    for (const bl of blisters) { const want = hovered === bl.group ? 0.25 : 0; const m = bl.group.userData.foilMat; m.emissiveIntensity += (want - m.emissiveIntensity) * 0.15; }
    const chartWant = hovered === chart ? 0.15 : 0; chart.position.y += (chartWant - chart.position.y) * 0.18;

    headPos.set(-0.3, 3.3, 0); doctor.localToWorld(headPos); headPos.project(camera);
    const b = $('bubble'); b.style.right = `${innerWidth - ((headPos.x + 1) / 2 * innerWidth) + 10}px`; b.style.top = `${(1 - headPos.y) / 2 * innerHeight}px`;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
