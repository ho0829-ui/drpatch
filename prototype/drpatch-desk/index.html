<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DR.PATCH 진료 책상</title>
<link rel="icon" href="brand/icon.svg" type="image/svg+xml">
<!--
  DR.PATCH 진료 책상 시제품 (docs/design.md 기준). 한 장면, 예시 데이터 — 실제 API를 부르지 않는다.
  3D 소품은 design/blender/*.py로 만든 models/*.glb.
  보는 법: python3 -m http.server 8010 --directory prototype  →  http://localhost:8010/drpatch-desk/
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 병원 청록 (docs/design.md) */
    --color-white: #FFFFFF; --color-bg: #EAF6F3; --color-wall: #CBEAE2; --color-mint: #B9E2D9;
    --color-teal: #3E9E98; --color-deep: #1F6F6B; --color-ink: #16313A; --color-coral: #F2734A;
    --color-replan: #7C5CD6; --color-paper: #FFFFFF;
    --sans: "IBM Plex Sans KR", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* 진료실 벽 + 벽 띠 + 바닥 */
  body { font-family: var(--sans); color: var(--color-ink); background: var(--color-wall); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .brand { position: fixed; top: 16px; left: 20px; display: flex; align-items: center; gap: 10px; color: var(--color-ink); z-index: 3;
           padding: 6px 18px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.9); box-shadow: 0 4px 0 var(--color-mint), 0 10px 24px rgba(22,49,58,.12); }
  .brand b { font: 700 22px/1 var(--mono); letter-spacing: .02em; }
  .brand .dot { color: var(--color-teal); }
  .brand small { display: block; font: 500 12px/1.4 var(--sans); color: var(--color-deep); margin-top: 4px; }

  .status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 3;
            display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px;
            background: #fff; box-shadow: 0 4px 0 var(--color-mint), 0 10px 24px rgba(22,49,58,.14); font: 600 14px/1 var(--sans); }
  .status .dots { display: flex; gap: 6px; }
  .status .dots i { width: 9px; height: 9px; border-radius: 50%; background: #D7E7E3; transition: background .3s; }
  .status .dots i.on { background: var(--color-teal); }

  .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 3;
              display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 32px); }
  .btn { font: 600 15px/1 var(--sans); padding: 14px 22px; border-radius: 999px; border: 0; cursor: pointer;
         background: #fff; color: var(--color-ink); box-shadow: 0 5px 0 #A9D8CD, 0 12px 24px rgba(22,49,58,.16);
         transition: transform .12s, box-shadow .12s; }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #A9D8CD, 0 6px 12px rgba(22,49,58,.14); }
  .btn.primary { background: var(--color-deep); color: #fff; box-shadow: 0 5px 0 #124A47, 0 12px 24px rgba(22,49,58,.2); }
  .btn.hot { background: var(--color-coral); color: var(--color-ink); box-shadow: 0 5px 0 #C2502C, 0 12px 24px rgba(22,49,58,.2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible { outline: 3px solid var(--color-deep); outline-offset: 3px; }
  .motion { display: flex; align-items: center; gap: 6px; color: var(--color-ink); font: 500 13px var(--sans); }

  .ticker { position: fixed; left: 24px; bottom: 24px; z-index: 2; font: 400 12px/1.7 var(--mono); color: var(--color-ink);
            max-width: 340px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.7); }
  .ticker:empty { display: none; }
  .ticker div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticker div:first-child { font-weight: 700; color: var(--color-deep); }
  .note { position: fixed; right: 24px; bottom: 28px; z-index: 2; color: var(--color-ink); font: 500 12px var(--sans); opacity: .75; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 8; font: 600 16px var(--sans); color: var(--color-deep); text-align: center; }
  .loading img { animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .loading img { animation: none; } }

  .bubble { position: fixed; z-index: 4; max-width: 290px; padding: 14px 16px; border-radius: 22px 22px 6px 22px;
            background: #fff; font: 500 15px/1.55 var(--sans); box-shadow: 0 6px 0 var(--color-mint), 0 16px 30px rgba(22,49,58,.18);
            transform: translateY(-100%); width: max-content; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .bubble.show { opacity: 1; }
  .bubble .avatar { position: absolute; left: -20px; top: -20px; width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 3px 8px rgba(22,49,58,.22); }
  .bubble b { display: block; padding-left: 22px; font: 700 11px/1 var(--mono); letter-spacing: .06em; color: var(--color-deep); margin-bottom: 6px; }

  .tip { position: fixed; z-index: 6; pointer-events: none; padding: 6px 10px; border-radius: 10px; background: var(--color-ink);
         color: #fff; font: 500 12px var(--mono); transform: translate(14px, 14px); opacity: 0; transition: opacity .12s; }
  .tip.show { opacity: 1; }
  #tags { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; padding: 3px 7px 3px 5px; border-radius: 999px;
         background: rgba(255,255,255,.94); color: var(--color-ink); font: 600 10.5px/1 var(--mono); white-space: nowrap;
         box-shadow: 0 2px 6px rgba(22,49,58,.18); transition: opacity .2s; }
  .tag i, .chip-float i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .chip-float { position: absolute; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #fff;
                font: 600 12px/1 var(--mono); color: var(--color-ink); white-space: nowrap; box-shadow: 0 4px 12px rgba(22,49,58,.2);
                transform: translate(-50%, -100%); animation: chipUp 1.5s ease-out forwards; }
  @keyframes chipUp { 0% { opacity: 0; translate: 0 10px; } 15% { opacity: 1; translate: 0 0; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -46px; } }
  body.reduced .chip-float { animation-duration: .4s; }

  /* 누르면 펼쳐지는 종이 */
  .sheet { position: fixed; top: 84px; right: 24px; width: min(380px, calc(100vw - 32px)); perspective: 1400px; z-index: 5; pointer-events: none; }
  .paper { position: relative; overflow: hidden; background: var(--color-paper); border-radius: 22px; padding: 24px 22px 20px;
           box-shadow: 0 6px 0 var(--color-mint), 0 22px 44px rgba(22,49,58,.22);
           transform-origin: 100% 50%; transform: rotateY(-100deg); opacity: 0;
           transition: transform .6s cubic-bezier(.2,1.35,.35,1), opacity .2s; }
  .sheet.open .paper { transform: none; opacity: 1; pointer-events: auto; }
  .paper::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(22,49,58,.12); pointer-events: none; }
  .paper .band { position: absolute; left: 0; right: 0; top: 0; height: 8px; }
  .paper .close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
                  background: var(--color-bg); color: var(--color-ink); font: 600 18px/1 var(--sans); }
  .eyebrow { margin: 0 0 6px; font: 700 11px/1 var(--mono); letter-spacing: .08em; color: var(--color-deep); }
  .paper h2 { margin: 0 0 12px; font: 700 24px/1.2 var(--sans); }
  .ver { display: flex; align-items: baseline; gap: 10px; font: 700 24px/1.2 var(--mono); margin-bottom: 14px; flex-wrap: wrap; }
  .ver .arrow { color: #7D9496; font-weight: 400; }
  .ver .tgt { color: var(--color-deep); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .badge { font: 700 12px/1 var(--mono); padding: 6px 10px; border-radius: 999px; letter-spacing: .04em; }
  .sev-critical { background: #FFE0E2; color: #9B1C2E; } .sev-high { background: #FFE9CC; color: #8A4600; }
  .sev-moderate { background: #FFF4C2; color: #6B5300; } .sev-low { background: #DCEBFF; color: #16508F; }
  .sev-unknown { background: #EEF1F1; color: #4A5759; outline: 1.5px dashed #8A9A9C; outline-offset: -1.5px; }
  .chip { font: 600 12px/1 var(--sans); padding: 6px 10px; border-radius: 999px; border: 1.5px solid var(--color-replan); color: #4E3596; }
  dl { display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; margin: 0 0 14px; font-size: 14px; line-height: 1.5; }
  dt { color: #5B7375; } dd { margin: 0; }
  .docnote { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--color-bg); font-size: 14px; line-height: 1.55; }
  .docnote b { font: 700 11px/1 var(--mono); color: var(--color-deep); display: block; margin-bottom: 4px; letter-spacing: .06em; }
  .list { list-style: none; margin: 0 0 14px; padding: 0; }
  .list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid #E3EFEC; }
  .list li:last-child { border-bottom: 0; }
  .list .n { font: 600 15px var(--sans); } .list .v { grid-column: 1; font: 400 13px var(--mono); color: #4A5759; }
  .list .badge { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .log { margin: 0; padding: 0; list-style: none; font: 400 12.5px/1.8 var(--mono); max-height: 52vh; overflow: auto; }

  .fallback { position: fixed; inset: 0; overflow: auto; padding: 32px 16px; background: var(--color-bg); z-index: 10; }
  .fallback > div { max-width: 640px; margin: 0 auto; }

  @media (max-width: 720px) {
    .brand { top: 14px; left: 16px; } .brand small { display: none; }
    .status { top: 64px; }
    .ticker, .note { display: none; }
    .controls { bottom: 16px; }
    .sheet { top: auto; bottom: 120px; left: 16px; right: 16px; width: auto; }
    .paper { transform-origin: 50% 100%; transform: rotateX(95deg); }
    .bubble { max-width: 220px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .paper, .bubble, .btn { transition: none; } }
  body.reduced .paper, body.reduced .bubble { transition: none; }
</style>

<body>
<canvas id="scene" aria-hidden="true"></canvas>

  <img src="brand/logo-mark.svg" width="46" height="46" alt="">

  <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>

<div class="ticker" id="ticker" aria-hidden="true"></div>
<div class="note">예시 데이터 · 실제 조회 아님 · 드래그 회전 · 오른쪽 드래그 이동 · 휠 줌 · 더블클릭 처음으로 · <span id="egg-count">숨은 것 0/14</span></div>

<div class="bubble" id="bubble" aria-hidden="true"><img class="avatar" src="brand/mascot.svg" alt=""><b>DR.PATCH</b><span id="bubble-text"></span></div>

<div class="tip" id="tip"></div>
<div id="tags" aria-hidden="true"></div>

<div class="sheet" id="sheet"><div class="paper" role="dialog" aria-labelledby="sheet-title">
  <div class="band" id="sheet-band"></div>
  <button class="close" id="sheet-close" aria-label="닫기">×</button>
  <div id="sheet-body"></div>
</div></div>

<nav class="controls">
  <button class="btn primary" id="btn-start" disabled>진료 시작</button>
  <button class="btn hot" id="btn-confirm" disabled>처방 확정</button>
  <button class="btn" id="btn-reset">처음부터</button>
  <label class="motion"><input type="checkbox" id="motion"> 움직임 줄이기</label>
</nav>

<section class="fallback" id="fallback" hidden><div>
  <h1><img src="brand/logo-lockup.svg" height="64" alt="DR.PATCH"></h1>
  <p id="fallback-msg">이 브라우저에서는 3D 책상을 그릴 수 없어 목록으로 보여드려요.</p>
  <ul class="list" id="fallback-list"></ul>
</div></section>

<script type="module">

const ITEMS = [
  P('Python', '3.8', '3.11', 'high', 1, '지원 종료일이 지났어요.', '오늘의 주인공이죠. 이걸 먼저 올려야 나머지가 따라옵니다.', ['큰 변경'], { kind: 'runtime' }),

const MODELS = ['room', 'ward', 'desk', 'eggs', 'blister_cell', 'blister_end', 'capsule', 'pills', 'bottle', 'tray', 'iv', 'chart', 'stamp', 'doctor'];

// 배치 (three 좌표: x 오른쪽, y 위, z 사용자 쪽). design/blender/scene_preview.py와 같게.
const LAYOUT = {
  bottle: [-5.9, 0, -1.9], tray: [-5.4, 0.075, 2.7] /* 곡반은 패드보다 살짝 높여 겹치지 않게 */, chart: [7.1, 0, 0.1, -0.08], stamp: [8.2, 0, 3.0],
  iv: [-12.6, -8.05, -9.2, 0, 2.5], pad: { x: 0.6, z: 0.9, w: 10.0, d: 4.8 },
  doctor: { x: 0, z: -7.0, seat: -2.6, scale: 2.8 },
};
const CELL = { w: 1.4, d: 1.24 }, END_W = 1.2;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const roundOf = (no) => ROUNDS.find((r) => r.no === no);

// ── 움직임 줄이기 ───────────────────────────────────────
let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('motion').checked = reduced;
document.body.classList.toggle('reduced', reduced);
$('motion').addEventListener('change', (e) => { reduced = e.target.checked; document.body.classList.toggle('reduced', reduced); });

function hasWebGL() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; }
}
function badge(sev) { return `<span class="badge sev-${sev}">${SEV[sev][1]}</span>`; }
function showFallback(msg) {
  $('loading')?.remove();
  if (msg) $('fallback-msg').textContent = msg;
  $('fallback').hidden = false;
  $('fallback-list').innerHTML = ITEMS.map((it) =>
    `<li><span class="n">${esc(it.name)} · ${it.round ? `${it.round}회차` : it.status === 'safe' ? '안전' : '다음 진료'}</span><span class="v">${esc(it.cur)} → ${esc(it.tgt)}</span>${badge(it.sev)}</li>`).join('');
}

if (!hasWebGL()) showFallback();
else init().catch((err) => { console.error(err); showFallback('진료실을 불러오지 못해 목록으로 보여드려요.'); });

async function init() {
  const loader = new GLTFLoader();
  const fontsReady = Promise.race([Promise.all([document.fonts.load('700 40px "IBM Plex Sans KR"'), document.fonts.load('700 40px "JetBrains Mono"')]),
                                   new Promise((r) => setTimeout(r, 1500))]).catch(() => {});
  const loaded = await Promise.all(MODELS.map((n) => loader.loadAsync(`models/${n}.glb`).then((g) => [n, g.scene])));
  await fontsReady;
  const M = Object.fromEntries(loaded);
  $('loading').remove();

  // ── 렌더러·장면·조명 ────────────────────────────────
  const canvas = $('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#CBEAE2');
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.42;

  const camera = new THREE.PerspectiveCamera(36, 1, 0.5, 150); // near를 키워 깊이 정밀도 확보 (맞닿는 면 깜빡임 방지)
  const BASE = new THREE.Vector3(0, 13.2, 18.6);
  const TARGET = new THREE.Vector3(0, 0.6, -1.4);
  const ROOM = { x: 23.5, y: 16.5, z: 40 }; // 카메라가 진료실 밖으로 나가지 않는 한계
  let distScale = 1;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9fcfc4, 0.6));
  const key = new THREE.DirectionalLight(0xfff8ef, 2.1); // 천장 조명 쪽 (앞 위 왼쪽)
  key.position.set(-7, 20, 12); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 1, far: 60 });
  key.shadow.bias = -0.0006; key.shadow.normalBias = 0.06; key.shadow.radius = 4; // 얇은 잎·패드의 그림자 얼룩 방지
  scene.add(key);
  const windowLight = new THREE.DirectionalLight(0xe3f6ff, 0.7); windowLight.position.set(14, 8, -16); scene.add(windowLight);

  const prep = (obj, cast = true) => {
    obj.traverse((o) => {
      if (!o.isMesh) return;
      o.receiveShadow = true;
      const m = o.material;
      if (m && m.transmission > 0) { // 굴절 유리는 장면을 한 번 더 그려서 무겁다 → 일반 반투명으로
        m.opacity = m.transmission >= 0.9 ? 0.28 : 0.72; m.transmission = 0; m.transparent = true; m.depthWrite = false;
      }
      o.castShadow = cast && !(m && m.transparent);
    });
    return obj;
  };

  // 움직이지 않는 메시는 재질별로 한 덩어리로 합친다 (그리기 횟수 ↓). exclude에 든 하위 트리는 그대로 둔다.
  function mergeStatic(parent, exclude = [], cast = true) {
    parent.updateMatrixWorld(true);
    const inv = parent.matrixWorld.clone().invert();
    const groups = new Map(); const remove = [];
    parent.traverse((o) => {
      if (!o.isMesh) return;
      for (let a = o; a && a !== parent; a = a.parent) if (exclude.includes(a)) return;
      const g = o.geometry.clone().applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
      if (!groups.has(o.material.uuid)) groups.set(o.material.uuid, { mat: o.material, geos: [] });
      groups.get(o.material.uuid).geos.push(g); remove.push(o);
    });
    for (const o of remove) o.parent.remove(o);
    for (const { mat, geos } of groups.values()) {
      const names = ['position', 'normal', 'uv'].filter((n) => geos.every((g) => g.attributes[n]));
      let list = geos.map((g) => { const ng = new THREE.BufferGeometry(); names.forEach((n) => ng.setAttribute(n, g.attributes[n])); if (g.index) ng.setIndex(g.index); return ng; });
      if (list.some((g) => !g.index)) list = list.map((g) => (g.index ? g.toNonIndexed() : g));
      const merged = mergeGeometries(list, false); if (!merged) continue;
      const mesh = new THREE.Mesh(merged, mat); mesh.receiveShadow = true; mesh.castShadow = cast && !mat.transparent; parent.add(mesh);
    }
  }

  function textTexture(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.flipY = false; // glTF UV 기준
    const redraw = (...a) => { g.clearRect(0, 0, w, h); draw(g, w, h, ...a); tex.needsUpdate = true; };
    redraw();
    return { tex, redraw };
  }
  const FONT = (wt, px, mono) => `${wt} ${px}px ${mono ? '"JetBrains Mono", monospace' : '"IBM Plex Sans KR", sans-serif'}`;

  // ── 움직임 엔진 ─────────────────────────────────────
  const tweens = new Set();
  const ease = { inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), out: (t) => 1 - Math.pow(1 - t, 3),
                 back: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }, lin: (t) => t };
  function tween(dur, update, e = ease.inOut) {
    return new Promise((res) => { if (reduced) { update(1); res(); return; } tweens.add({ t0: performance.now(), dur, update, e, res }); });
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 250) : ms));

  // ── 진료실·책상 ─────────────────────────────────────
  const world = new THREE.Group(); scene.add(world);
  world.add(prep(M.room, false));
  world.add(prep(M.desk));
  const bulb = M.desk.getObjectByName('LampBulb');
  if (bulb) { const lamp = new THREE.PointLight(0xffe7b8, 6, 14, 1.6); bulb.getWorldPosition(lamp.position); scene.add(lamp); }
  world.add(prep(M.ward));
  mergeStatic(M.room, [], false); mergeStatic(M.ward); mergeStatic(M.desk);

  const pickRoots = [];
  const addPick = (obj, kind, data = {}) => { obj.userData = { ...obj.userData, kind, ...data }; pickRoots.push(obj); };

  // ── 이스터에그 소품 ─────────────────────────────────
  world.add(prep(M.eggs));
  const signTex = textTexture(400, 400, (c, w, h) => {
    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, w, h);
    c.fillStyle = COLOR.ink; c.textAlign = 'center';
    c.font = FONT(700, 64, true); c.fillText('FRI', w / 2, 150);
    c.font = FONT(700, 40, true); c.fillText('DEPLOY', w / 2, 205);
    c.strokeStyle = '#E5484D'; c.lineWidth = 26;
    c.beginPath(); c.arc(w / 2, 165, 128, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(w / 2 - 90, 255); c.lineTo(w / 2 + 90, 75); c.stroke();
    c.fillStyle = COLOR.ink; c.font = FONT(700, 38); c.fillText('금요일 배포 금지', w / 2, 362);
  });
  M.eggs.getObjectByName('SignFace').material = new THREE.MeshStandardMaterial({ map: signTex.tex, roughness: 0.6 });
  const secondPivot = M.eggs.getObjectByName('SecondPivot');
  const eggNodes = {};
  M.eggs.traverse((o) => { if (o.name.startsWith('Egg_')) eggNodes[o.name.slice(4)] = o; });
  for (const [id, node] of Object.entries(eggNodes)) { mergeStatic(node, [secondPivot]); addPick(node, 'egg', { egg: id }); }
  const eyeHit = new THREE.Mesh(new THREE.BoxGeometry(3.2, 4.4, 0.3), new THREE.MeshBasicMaterial({ visible: false }));
  eyeHit.position.set(-6.5, 5.6, -12.95); world.add(eyeHit); addPick(eyeHit, 'egg', { egg: 'eyechart' });
  const found = new Set();
  try { JSON.parse(localStorage.getItem('drpatch-eggs') || '[]').forEach((k) => found.add(k)); } catch { /* 저장 안 되는 환경 */ }
  const showCount = () => { $('egg-count').textContent = `숨은 것 ${found.size}/${Object.keys(EGGS).length}`; };
  showCount();

  // ── 블리스터: 회차마다 한 판, 칸 수는 N에 맞춰 조립 ─────
  const cols = Math.ceil(PER_ROUND / 2);
  const packW = END_W + cols * CELL.w, packD = CELL.d * 2;
  const packs = ROUNDS.map((r) => {
    const g = new THREE.Group(); world.add(g);
    const end = prep(M.blister_end.clone(true)); end.position.x = END_W / 2; g.add(end);
    const labelMesh = end.getObjectByName('Label');
    const label = textTexture(220, 520, (c, w, h, stamped) => {
      c.fillStyle = COLOR.ink; c.beginPath(); c.roundRect(0, 0, w, h, 30); c.fill();
      c.fillStyle = '#fff'; c.textAlign = 'center';
      c.font = FONT(700, 120, true); c.fillText(String(r.no), w / 2, 170);
      c.font = FONT(600, 40); c.fillText('회차', w / 2, 230);
      c.font = FONT(700, 44, true); c.fillText(r.date, w / 2, 330);
      c.font = FONT(400, 28, true); c.fillStyle = COLOR.mint; c.fillText('22–24시', w / 2, 380);
      if (stamped) {
        c.save(); c.translate(w / 2, 450); c.rotate(-0.25);
        c.strokeStyle = COLOR.coral; c.lineWidth = 8; c.beginPath(); c.roundRect(-88, -38, 176, 76, 18); c.stroke();
        c.fillStyle = COLOR.coral; c.font = FONT(700, 40, true); c.fillText('Rx 확정', 0, 14); c.restore();
      }
    });
    labelMesh.material = new THREE.MeshStandardMaterial({ map: label.tex, roughness: 0.6 }); mergeStatic(end);
    const slots = [];
    for (let k = 0; k < PER_ROUND; k++) {
      const cell = prep(M.blister_cell.clone(true));
      const x = END_W + CELL.w / 2 + Math.floor(k / 2) * CELL.w, z = (k % 2 === 0 ? -1 : 1) * CELL.d / 2;
      cell.position.set(x, 0, z); g.add(cell);
      const well = cell.getObjectByName('Well'); const wellMat = well.material = well.material.clone();
      mergeStatic(cell);
      slots.push({ x, z, wellMat });
    }
    addPick(g, 'blister', { round: r.no });
    return { group: g, round: r, label, slots, used: 0 };
  });
  (function arrangePacks() { // 패드 안에 줄 바꿔 놓고, 넘치면 줄인다
    const { x: px, z: pz, w: pw, d: pd } = LAYOUT.pad; const gap = 0.45;
    const perRow = Math.max(1, Math.floor((pw + gap) / (packW + gap)));
    const rows = Math.ceil(packs.length / perRow);
    const s = Math.min(1, pd / (rows * packD + (rows - 1) * gap), pw / (Math.min(perRow, packs.length) * packW + (Math.min(perRow, packs.length) - 1) * gap));
    packs.forEach((p, i) => {
      const row = Math.floor(i / perRow), n = Math.min(perRow, packs.length - row * perRow), col = i % perRow;
      const rowW = n * packW + (n - 1) * gap;
      p.group.scale.setScalar(s);
      p.group.position.set(px + (-rowW / 2 + col * (packW + gap)) * s, 0, pz + (-(rows * packD + (rows - 1) * gap) / 2 + packD / 2 + row * (packD + gap)) * s);
    });
  })();

  // ── 약병 · 곡반 ─────────────────────────────────────
  const [bx, by, bz] = LAYOUT.bottle;
  const jar = prep(M.bottle); jar.position.set(bx, by, bz); world.add(jar);
  const lid = jar.getObjectByName('Lid'); const LID0 = lid.position.clone();
  addPick(jar, 'jar');
  const tray = prep(M.tray); tray.position.set(...LAYOUT.tray); world.add(tray);
  addPick(tray, 'tray');
  const TRAY_SPOTS = [[-0.9, -0.25], [0, -0.3], [0.9, -0.25], [-0.45, 0.35], [0.45, 0.35], [1.25, 0.3]];
  let trayUsed = 0;

  // ── 알약: 인기 패키지는 특별 알약, 나머지는 일반 캡슐 ───
  const JAR_SCALE = 0.72;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pills = ITEMS.map((it, i) => {
    const root = new THREE.Group(); world.add(root);
    const lift = new THREE.Group(); root.add(lift);
    const inner = new THREE.Group(); lift.add(inner);
    const special = M.pills.getObjectByName(`Pill_${it.name.toLowerCase()}`);
    const model = prep((special || M.capsule).clone(true)); model.position.set(0, 0, 0); inner.add(model); mergeStatic(model);
    // 약병 안: 층마다 4알을 원 둘레 방향으로 눕혀 겹치지 않게 (조금 작게)
    const layer = Math.floor(i / 4), k = i % 4, a = k * Math.PI / 2 + layer * 0.78;
    root.position.set(bx + Math.cos(a) * 0.55, 0.32 + layer * 0.4, bz + Math.sin(a) * 0.55);
    root.rotation.set(0, -a + Math.PI / 2, (rnd() - 0.5) * 0.3);
    root.scale.setScalar(JAR_SCALE);
    const pill = { it, root, lift, inner, special: !!special, inJar: true, slot: null, liftY: 0, phase: rnd() * 6, tag: null };
    addPick(root, 'pill', { pill });
    return pill;
  });
  const pillByName = (n) => pills.find((p) => p.it.name === n);

  // ── 수액 거치대 (진료실 바닥, 박사님 옆) ─────────────
  const iv = prep(M.iv); const [ix, iy, iz, irot, iscale] = LAYOUT.iv;
  iv.position.set(ix, iy, iz); iv.rotation.y = irot; iv.scale.setScalar(iscale); world.add(iv);
  const liquid = iv.getObjectByName('Liquid'); const LIQ_Y = liquid.scale.y;
  const drop = iv.getObjectByName('Drop'); const DROP0 = drop.position.clone(); const DROP_S = drop.scale.clone();
  let level = 1;
  async function drip() {
    level = Math.max(0.2, level - 0.03);
    const from = liquid.scale.y / LIQ_Y;
    tween(500, (p) => { liquid.scale.y = LIQ_Y * THREE.MathUtils.lerp(from, level, p); });
    await tween(420, (p) => { drop.position.y = DROP0.y - p * 0.3; drop.scale.copy(DROP_S).multiplyScalar(1 - p * 0.5); }, ease.lin);
    drop.position.copy(DROP0); drop.scale.copy(DROP_S);
  }

  // ── 진료 차트 (실행 로그) ───────────────────────────
  const LOG = [];
  const chart = prep(M.chart); chart.position.set(LAYOUT.chart[0], 0, LAYOUT.chart[2]); chart.rotation.y = LAYOUT.chart[3]; world.add(chart);
  const paper = textTexture(440, 560, (c, w, h) => {
    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, w, h);
    c.fillStyle = COLOR.teal; c.fillRect(0, 0, w, 14);
    c.fillStyle = COLOR.ink; c.font = FONT(700, 34); c.fillText('진료 기록', 26, 92);
    c.font = FONT(400, 21, true);
    LOG.slice(-14).forEach((line, i) => { c.fillStyle = i === Math.min(LOG.length, 14) - 1 ? '#1F6F6B' : '#4A5759'; c.fillText(line.slice(0, 32), 26, 140 + i * 29); });
    if (!LOG.length) { c.fillStyle = '#8A9A9C'; c.fillText('아직 기록이 없어요', 26, 140); }
  });
  chart.getObjectByName('Paper').material = new THREE.MeshStandardMaterial({ map: paper.tex, roughness: 0.85 });
  addPick(chart, 'chart');

  // ── 도장 ────────────────────────────────────────────
  const STAMP_HOME = new THREE.Vector3(...LAYOUT.stamp);
  const stamp = prep(M.stamp); stamp.position.copy(STAMP_HOME); world.add(stamp);
  addPick(stamp, 'stamp');

  // ── 닥터 패치: 책상 건너편 의자에 앉아 두 손을 책상에 ──
  const D = LAYOUT.doctor;
  const doctor = new THREE.Group(); doctor.position.set(D.x, D.seat - 0.14 * D.scale, D.z); doctor.scale.setScalar(D.scale); world.add(doctor);
  doctor.add(prep(M.doctor));
  const docBody = M.doctor.getObjectByName('Body'); const BODY_Y = docBody.position.y;
  const eyes = ['EyeL', 'EyeR'].map((n) => M.doctor.getObjectByName(n)); const EYE_Y = eyes.map((e) => e.scale.y);
  const arms = ['ArmL', 'ArmR'].map((n) => M.doctor.getObjectByName(n));
  const ARM0 = arms.map((a) => a.rotation.clone());
  const REST = -1.0; // 팔을 앞으로 내밀어 손을 책상에
  arms.forEach((a, i) => (a.rotation.x = ARM0[i].x + REST));
  addPick(doctor, 'doctor');

      openSheet(itemSheet(p.it), SEV[p.it.sev][0]);
    } else if (d.kind === 'blister') {
      if (state === 'idle' || state === 'running') { say('빈 포장지예요. 처방이 나오면 채워집니다.'); return; }
      openSheet(roundSheet(d.round), COLOR.ink);
    } else if (d.kind === 'chart') openSheet(logSheet(), COLOR.teal);
    else if (d.kind === 'tray') { if (state === 'idle' || state === 'running') say('곡반은 건강한 녀석들 자리입니다.'); else openSheet(traySheet(), COLOR.teal); }
    else if (d.kind === 'doctor') { docAct.hop(); say(QUIPS[Math.floor(Math.random() * QUIPS.length)]); }
    else if (d.kind === 'jar') { if (state === 'planned' || state === 'done') openSheet(jarSheet(), COLOR.ink); else say(`접수된 패키지 ${ITEMS.length}개입니다. 진료 시작을 누르시죠.`); }
    else if (d.kind === 'stamp') { if (state === 'planned') confirmPlan(); else say('도장은 처방이 나온 뒤에 찍습니다.'); }
  });

  // ── 후처리(접촉 그림자) · 화면 크기 ─────────────────
  let composer = null, useAO = new URLSearchParams(location.search).get('hq') === '1';
  const forceLow = new URLSearchParams(location.search).get('lq') === '1';
  try {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const ao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    ao.updateGtaoMaterial({ radius: 0.9, distanceExponent: 1.2, thickness: 1.2, scale: 1.1 });
    ao.blendIntensity = 0.85;
    composer.addPass(ao);
    composer.addPass(new OutputPass());
  } catch (err) { console.warn('AO 없이 그립니다', err); composer = null; }

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); composer?.setSize(w, h); camera.aspect = w / h;
    distScale = Math.min(2.2, Math.max(1, 1.55 / camera.aspect)); // 세로 화면은 멀리서
    controls.maxDistance = BASE_DIST * 1.7 * distScale;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  camera.position.copy(homeView().pos);

  // ── 매 프레임 ───────────────────────────────────────
  const headPos = new THREE.Vector3(); const dir = new THREE.Vector3(); let blinkAt = 2, blinkUntil = 0;
  const perf = { n: 0, sum: 0, last: performance.now() };
  say('어서 오세요. 오늘은 어디가 불편한 서버인가요?');
  function frame(now) {
    const t = now / 1000;
    for (const tw of tweens) { const p = Math.min(1, (now - tw.t0) / tw.dur); tw.update(tw.e(p)); if (p >= 1) { tweens.delete(tw); tw.res(); } }

    if (window.__freeze) { camera.position.copy(window.__freeze.pos); camera.lookAt(window.__freeze.at); }
    else {
      controls.enableDamping = !reduced;
      controls.update();
      TARGET_BOX.clampPoint(controls.target, controls.target);
      CAMERA_BOX.clampPoint(camera.position, camera.position); // 방 밖으로 못 나가게
      camera.lookAt(controls.target);
    }

    if (!reduced) {
      const breathe = Math.sin(t * 1.8);
      docBody.scale.set(1 + breathe * 0.008, 1 + breathe * 0.014, 1 + breathe * 0.008);
      doctor.rotation.y += ((controls.getAzimuthalAngle() * 0.35) - doctor.rotation.y) * 0.05; // 박사님이 보는 사람 쪽으로 고개
      if (t > blinkAt) { blinkUntil = t + 0.13; blinkAt = t + 2.8 + Math.random() * 3; }
      for (const p of pills) if (p.inJar && state === 'idle') p.inner.rotation.z = Math.sin(t * 1.6 + p.phase) * 0.08;
    }
    eyes.forEach((e, i) => (e.scale.y = t < blinkUntil ? EYE_Y[i] * 0.12 : EYE_Y[i]));
    if (secondPivot) secondPivot.rotation.z = (t % 1) < 0.12 ? -0.1 : 0; // 멈춘 시계: 초침이 07초에서 넘어가려다 되돌아온다

    for (const p of pills) { const want = hovered === p.root && !p.inJar ? 0.18 : 0; p.liftY += (want - p.liftY) * 0.18; p.lift.position.y = p.liftY; }
    const chartWant = hovered === chart ? 0.15 : 0; chart.position.y += (chartWant - chart.position.y) * 0.18;

    headPos.set(-0.75, 2.25, 0); doctor.localToWorld(headPos); headPos.project(camera);
    const b = $('bubble'); b.style.right = `${innerWidth - ((headPos.x + 1) / 2 * innerWidth) + 10}px`; b.style.top = `${(1 - headPos.y) / 2 * innerHeight}px`;

    const showTags = camera.position.distanceTo(controls.target) < BASE_DIST * 1.3 * distScale;
    for (const p of pills) {
      if (!p.tag) continue;
      tmpV.set(0, 0.45, 0); p.root.localToWorld(tmpV); const [x, y, front] = toScreen(tmpV);
      p.tag.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`; p.tag.style.opacity = showTags && front && popped !== p ? 1 : 0;
    }

    // 접촉 그림자(AO)는 기기가 버틸 때만: 처음 2초 동안 평균 프레임이 16ms 안이면 켠다
    if (!forceLow && composer && perf.n < 120) { perf.sum += now - perf.last; perf.n++; if (perf.n === 120 && perf.sum / 120 < 16.5) useAO = true; }
    perf.last = now;
    if (useAO && composer) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__dbg = { renderer, scene, camera, ao: () => useAO, freeze: (on) => (window.__freeze = on) }; // 성능 확인용 (콘솔)
}
</script>
</body>
</html>
